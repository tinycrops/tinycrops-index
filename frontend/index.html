<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tinycrops — published work</title>
<style>
  :root{
    --bg:#0e0f13; --panel:#14161c; --line:#2a2d34;
    --ink:#e8e4d8; --sub:#9a958a; --amber:#ffb000; --grey:#6a6f78;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'DejaVu Serif',serif;line-height:1.55;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .msg{text-align:center;color:var(--sub);font-style:italic}
  .msg h1{color:var(--amber);font-size:1.6rem;margin:0 0 12px;letter-spacing:.06em}
</style>
</head>
<body>
<div class="msg">
  <h1>PUBLISHED WORK</h1>
  <p>Index is being generated — check back in a few minutes.</p>
</div>
</body>
</html>
